<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEMIS Tickets - Login</title>
    <!-- Tailwind CSS y Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --bg-labs: #F8F7F4;
            --bemis-blue: #0047BA;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-labs);
            color: #111827;
        }
        h1, h2, h3, .font-display { font-family: 'Plus Jakarta Sans', sans-serif; }
        .apple-card {
            background: #FFFFFF;
            border: 1px solid rgba(229, 231, 235, 0.85);
            border-radius: 28px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
        }
        .apple-input {
            background-color: #F8F7F4;
            border: 1px solid #E5E7EB;
            border-radius: 16px;
            transition: all 0.2s ease;
        }
        .apple-input:focus {
            background-color: #FFFFFF;
            border-color: var(--bemis-blue);
            box-shadow: 0 0 0 3px rgba(0, 71, 186, 0.12);
            outline: none;
        }
        .btn-primary {
            background-color: var(--bemis-blue);
            border-radius: 9999px;
            transition: all 0.2s ease;
        }
        .btn-primary:hover { background-color: #00368c; transform: translateY(-1px); }
        .btn-secondary {
            background-color: #111827;
            border-radius: 9999px;
            transition: all 0.2s ease;
        }
        .btn-secondary:hover { background-color: #374151; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden" id="loginBody">
    
    <!-- Elementos de fondo decorativos (Canvas para animaciones de animations.js) -->
    <canvas id="snowCanvas" class="fixed inset-0 pointer-events-none z-0 hidden"></canvas>
    <div id="halloween-bats" class="fixed inset-0 pointer-events-none z-0 hidden overflow-hidden"></div>
    <div id="muertos-flowers" class="fixed inset-0 pointer-events-none z-0 hidden overflow-hidden"></div>

    <!-- Píldora de marca superior -->
    <div class="absolute top-6 left-6 z-10 hidden sm:flex">
        <span class="inline-flex items-center gap-2 bg-white border border-neutral-200 px-4 py-2 rounded-full text-xs font-semibold text-neutral-600 shadow-sm">
            <span class="w-2 h-2 rounded-full bg-[#0047BA]"></span>
            Bemis México • Soporte de Sistemas
        </span>
    </div>

    <!-- Tarjeta Central de Login -->
    <div class="apple-card w-full max-w-md p-8 sm:p-10 z-10 relative">
        <div class="text-center mb-8 flex flex-col items-center">
            <!-- Logo Bemis -->
            <img src="https://file.notion.so/f/f/03c86e/image_03c86e.png" alt="Bemis Logo" class="h-14 w-auto mb-4 object-contain">
            
            <h1 class="text-2xl font-display font-bold text-neutral-900 mb-1">BEMIS TICKETS</h1>
            <p class="text-[10px] font-bold tracking-widest text-neutral-400 uppercase">Mesa de Ayuda de TI</p>
        </div>

        <!-- Formulario (Mantiene IDs intactos para app.js/auth.js) -->
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-neutral-600 mb-2">Selecciona tu Correo Corporativo</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-neutral-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                    </span>
                    <!-- Selector dinámico llenado por JS -->
                    <select id="emailSelect" class="apple-input w-full pl-11 pr-10 py-3.5 text-sm text-neutral-900 font-medium cursor-pointer appearance-none" required>
                        <option value="" disabled selected>Cargando correos...</option>
                    </select>
                    <span class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-neutral-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </span>
                </div>
            </div>

            <!-- Contenedor Contraseña (Se muestra dinámicamente) -->
            <div id="passwordContainer" class="hidden transform transition-all duration-300">
                <label class="flex items-center gap-1.5 text-xs font-semibold text-neutral-600 mb-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                    Contraseña de Administrador
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-neutral-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    </span>
                    <input type="password" id="adminPassword" placeholder="••••••••" class="apple-input w-full pl-11 pr-12 py-3.5 text-sm text-neutral-900">
                    <button type="button" id="togglePasswordBtn" class="absolute inset-y-0 right-0 pr-4 flex items-center text-neutral-400 hover:text-neutral-600 focus:outline-none">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" id="loginBtn" class="btn-secondary w-full py-3.5 px-6 text-white font-semibold text-sm shadow-md flex justify-center items-center gap-2 mt-2">
                <span>Ingresar al Sistema</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </button>
        </form>
        
        <div class="mt-6 text-center">
             <p class="text-[10px] text-neutral-400">© 2026 Bemis Manufacturing Company</p>
        </div>
    </div>

    <!-- Scripts de Firebase y Lógica -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="db.js"></script>
    <script type="module" src="animations.js"></script>
    <script type="module" src="auth.js"></script>
</body>
</html>
