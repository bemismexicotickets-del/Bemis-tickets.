<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEMIS Tickets - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8f7f2;
      transition: background-color 0.5s ease;
    }
    .font-bemis {
      font-family: 'Montserrat', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6 relative overflow-x-hidden select-none text-slate-800">

  <!-- Animaciones estacionales -->
  <canvas id="seasonalCanvas" class="fixed inset-0 pointer-events-none z-0 w-full h-full opacity-80"></canvas>

  <!-- Etiqueta superior izquierda -->
  <div class="relative z-10 flex items-center">
    <div class="inline-flex items-center gap-2.5 bg-white/90 backdrop-blur-md px-4 py-2 rounded-full shadow-sm border border-slate-200/80">
      <span class="w-2.5 h-2.5 rounded-full bg-[#0047BA]"></span>
      <span class="text-xs font-bold text-slate-700 tracking-tight">Bemis México • Soporte de Sistemas</span>
    </div>
  </div>

  <!-- Tarjeta central de Login -->
  <main class="relative z-10 flex-1 flex items-center justify-center my-6">
    <div class="w-full max-w-md bg-white rounded-[32px] shadow-[0_20px_60px_-15px_rgba(0,0,0,0.08)] border border-slate-100 p-8 sm:p-10 text-center">
      
      <!-- Logo sincronizado con el Admin -->
      <div class="flex justify-center mb-3">
        <div class="relative w-[170px] flex items-center justify-center">
          <span id="logoSeasonOrnament" class="absolute -top-2 right-1 text-2xl z-20 pointer-events-none animate-pulse"></span>
          <img id="loginLogoImg" class="w-full h-auto max-h-16 object-contain" alt="Bemis Logo" />
        </div>
      </div>

      <h1 class="text-xl font-extrabold text-slate-900 tracking-tight font-bemis">BEMIS TICKETS</h1>
      <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mt-1 mb-8">Mesa de Ayuda de TI</p>

      <!-- Formulario de Login -->
      <form id="loginForm" class="space-y-5 text-left">
        <div>
          <label for="emailSelect" class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">
            Selecciona tu correo corporativo
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
            </span>
            <select
              id="emailSelect"
              required
              class="w-full pl-10 pr-9 py-3.5 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 transition appearance-none cursor-pointer"
            >
              <option value="" disabled selected>Cargando correos...</option>
            </select>
            <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 pointer-events-none">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
              </svg>
            </span>
          </div>
        </div>

        <!-- Campo de contraseña -->
        <div id="passwordContainer" class="hidden space-y-2">
          <label for="adminPassword" class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider">
            Contraseña de Administrador
          </label>
          <div class="relative">
            <input
              type="password"
              id="adminPassword"
              placeholder="Ingresa tu contraseña..."
              class="w-full pl-4 pr-16 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition"
            />
            <button
              type="button"
              id="togglePasswordBtn"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-700 text-xs font-bold"
            >
              Mostrar
            </button>
          </div>
        </div>

        <div id="loginError" class="hidden text-xs font-semibold text-rose-600 bg-rose-50 border border-rose-200 rounded-xl p-3 text-center"></div>

        <button
          type="submit"
          id="loginBtn"
          class="w-full py-3.5 px-6 bg-[#0f172a] hover:bg-slate-800 active:scale-[0.99] text-white font-bold text-sm rounded-xl shadow-lg shadow-slate-900/10 transition flex items-center justify-center gap-2 cursor-pointer"
        >
          <span>Ingresar al Portal</span>
        </button>
      </form>

      <p class="text-[11px] text-slate-400 mt-8 font-medium">© 2026 Bemis Manufacturing Company</p>
    </div>
  </main>

  <div class="h-4"></div>

  <script src="animations.js"></script>
  <script type="module">
    import { ADMIN_EMAIL, ADMIN_NAME } from "./firebase-config.js";
    import { login, getRememberedEmail, setRememberedEmail } from "./auth.js";
    import { getAllUsers, subscribeToGlobalTheme } from "./db.js";

    const DEFAULT_BEMIS_SVG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" width="360" height="120">
        <path d="M 15 52 C 95 6, 235 -4, 312 42 L 298 64 C 225 22, 98 24, 15 52 Z" fill="#0047BA"/>
        <text x="32" y="92" fill="#0047BA" font-family="Montserrat, Arial, sans-serif" font-weight="900" font-style="italic" font-size="64" letter-spacing="1">BEMIS</text>
        <line x1="32" y1="104" x2="295" y2="104" stroke="#0047BA" stroke-width="4"/>
      </svg>`
    );
    document.getElementById("loginLogoImg").src = localStorage.getItem("bemis_official_custom_logo") || DEFAULT_BEMIS_SVG;

    const emailSelect = document.getElementById("emailSelect");
    const passwordContainer = document.getElementById("passwordContainer");
    const adminPassword = document.getElementById("adminPassword");
    const togglePasswordBtn = document.getElementById("togglePasswordBtn");
    const loginForm = document.getElementById("loginForm");
    const loginError = document.getElementById("loginError");
    const loginBtn = document.getElementById("loginBtn");

    const usersByEmail = new Map();

    const themeOrnaments = { navidad: "🎅", halloween: "🎃", dia_muertos: "🏵️", san_valentin: "💖", primavera: "🌸", estandar: "" };
    subscribeToGlobalTheme((activeTheme, activeBg) => {
      if (window.seasonalEngine) window.seasonalEngine.setTheme(activeTheme);
      const ornamentSpan = document.getElementById("logoSeasonOrnament");
      if (ornamentSpan) ornamentSpan.innerText = themeOrnaments[activeTheme] || "";
      if (activeBg && activeBg !== "#0f172a" && activeBg !== "#020617") {
        document.body.style.backgroundColor = activeBg;
      } else {
        document.body.style.backgroundColor = "#f8f7f2";
      }
    });

    togglePasswordBtn.addEventListener("click", () => {
      const isPass = adminPassword.type === "password";
      adminPassword.type = isPass ? "text" : "password";
      togglePasswordBtn.textContent = isPass ? "Ocultar" : "Mostrar";
    });

    function mostrarError(msg) {
      loginError.textContent = msg;
      loginError.classList.remove("hidden");
    }

    function actualizarCampoPassword(email) {
      if (!email) return;
      const clean = email.trim().toLowerCase();
      const userObj = usersByEmail.get(clean);
      const isSuper = clean === (ADMIN_EMAIL || "").toLowerCase() || clean === "mario.ortiz@bemismfg.com" || clean.includes("mario");
      const requiresPass = isSuper || (userObj && userObj.role === "admin");

      if (requiresPass) {
        passwordContainer.classList.remove("hidden");
        adminPassword.required = true;
      } else {
        passwordContainer.classList.add("hidden");
        adminPassword.required = false;
        adminPassword.value = "";
      }
    }

    async function cargarListaCorreos() {
      const superAdminEmail = (ADMIN_EMAIL || "mario.ortiz@bemismfg.com").toLowerCase();
      usersByEmail.set(superAdminEmail, {
        email: superAdminEmail,
        nombreCompleto: ADMIN_NAME || "Mario Ortiz (Administrador)",
        departamento: "Sistemas",
        role: "admin"
      });

      try {
        const dbUsers = await getAllUsers();
        dbUsers.forEach(u => {
          if (u && u.email) {
            usersByEmail.set(u.email.trim().toLowerCase(), u);
          }
        });
      } catch (err) {
        console.warn("Aviso al cargar directorio:", err);
      }

      const sortedUsers = Array.from(usersByEmail.values()).sort((a, b) =>
        (a.nombreCompleto || a.email).localeCompare(b.nombreCompleto || b.email)
      );

      emailSelect.innerHTML = '<option value="" disabled selected>Selecciona tu correo...</option>';
      sortedUsers.forEach(u => {
        const emailLower = u.email.trim().toLowerCase();
        const opt = document.createElement("option");
        opt.value = emailLower;
        opt.textContent = u.nombreCompleto ? `${u.nombreCompleto} — ${emailLower}` : emailLower;
        emailSelect.appendChild(opt);
      });

      const remembered = getRememberedEmail();
      if (remembered && usersByEmail.has(remembered.toLowerCase())) {
        emailSelect.value = remembered.toLowerCase();
        actualizarCampoPassword(emailSelect.value);
      }
    }

    emailSelect.addEventListener("change", (e) => {
      loginError.classList.add("hidden");
      actualizarCampoPassword(e.target.value);
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginError.classList.add("hidden");

      const selectedEmail = (emailSelect.value || "").trim().toLowerCase();
      if (!selectedEmail) {
        mostrarError("Selecciona tu correo corporativo.");
        return;
      }

      const userObj = usersByEmail.get(selectedEmail);
      const isSuper = selectedEmail === (ADMIN_EMAIL || "").toLowerCase() || selectedEmail === "mario.ortiz@bemismfg.com" || selectedEmail.includes("mario");
      const isAdmin = isSuper || (userObj && userObj.role === "admin");

      const passwordToUse = isAdmin
        ? adminPassword.value
        : (userObj?.passwordOriginal || "BemisUser2026!");

      if (isAdmin && !passwordToUse) {
        mostrarError("Ingresa tu contraseña de administrador.");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span>Iniciando sesión...</span>';

      try {
        const res = await login(selectedEmail, passwordToUse);

        if (res.success && res.user) {
          sessionStorage.setItem("bemis_session_user", JSON.stringify(res.user));
          localStorage.setItem("bemis_session_user", JSON.stringify(res.user));
          setRememberedEmail(selectedEmail);
          window.location.href = (res.user.role === "admin" || isSuper) ? "admin.html" : "user.html";
          return;
        }

        if (!isAdmin && userObj) {
          sessionStorage.setItem("bemis_session_user", JSON.stringify(userObj));
          localStorage.setItem("bemis_session_user", JSON.stringify(userObj));
          setRememberedEmail(selectedEmail);
          window.location.href = "user.html";
          return;
        }

        mostrarError(res.error || "Credenciales incorrectas. Verifica tu contraseña.");
      } catch (err) {
        console.error("Error en login:", err);
        mostrarError("Error al autenticar con Firebase.");
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<span>Ingresar al Portal</span>';
      }
    });

    cargarListaCorreos();
  </script>
</body>
</html>
