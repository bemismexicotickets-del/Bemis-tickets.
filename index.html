<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bemis Tickets - Mesa de Ayuda TI | Inicio de Sesión</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.5s ease; }
    .font-bemis { font-family: 'Montserrat', sans-serif; }
    @keyframes loginFadeIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    .animate-login-entry { animation: loginFadeIn 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between relative overflow-x-hidden">
  <canvas id="seasonalCanvas" class="fixed inset-0 pointer-events-none z-10 w-full h-full"></canvas>

  <header class="relative z-20 max-w-6xl mx-auto w-full p-4 sm:p-6 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="px-3.5 py-1.5 rounded-full bg-slate-900/90 border border-slate-700/80 text-xs font-semibold text-slate-300 backdrop-blur-md">
         Bemis México • Soporte de Sistemas
      </span>
    </div>
  </header>

  <main class="relative z-20 max-w-md w-full mx-auto my-auto px-4 animate-login-entry">
    <div id="loginCard" class="bg-slate-900/90 backdrop-blur-xl border border-blue-500/30 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden transition-all duration-500">
      <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-blue-600 via-cyan-400 to-indigo-600"></div>
      
      <!-- LOGOTIPO BEMIS OFICIAL -->
      <div class="flex flex-col items-center mb-6">
        <div class="relative w-full max-w-[200px] mb-2 flex justify-center">
          <span id="logoSeasonOrnament" class="absolute -top-3 -right-2 text-2xl z-20 pointer-events-none animate-pulse"></span>
          <svg viewBox="0 0 400 150" class="w-full h-auto drop-shadow-lg" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 20 80 Q 200 -20 380 80 Q 360 40 200 10 Q 50 40 20 80 Z" fill="#0052cc"/>
            <text x="50%" y="110" font-family="Montserrat, sans-serif" font-weight="900" font-style="italic" font-size="76" fill="#0052cc" text-anchor="middle">BEMIS</text>
            <text x="50%" y="145" font-family="Montserrat, sans-serif" font-weight="900" font-size="28" fill="#38bdf8" text-anchor="middle" letter-spacing="4">TICKETS</text>
          </svg>
        </div>
        <div class="mt-1 text-[10px] tracking-wider font-bold text-slate-300 uppercase text-center">
          Mesa de Ayuda de TI • SOPORTE DE SISTEMAS
        </div>
      </div>

      <div id="errorAlert" class="hidden mb-4 p-3 rounded-xl bg-rose-500/20 border border-rose-500/40 text-rose-300 text-xs flex items-center gap-2">
        <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i><span id="errorMsg">Error</span>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Selecciona tu Correo Corporativo</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <!-- Datalist para autocompletar correos -->
            <input type="email" id="emailInput" list="listaCorreos" required placeholder="Escribe o selecciona tu correo..." autocomplete="off" class="w-full pl-10 pr-3.5 py-2.5 rounded-xl bg-slate-800/90 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 font-mono transition-colors">
            <datalist id="listaCorreos"></datalist>
          </div>
        </div>
        
        <!-- Contenedor de contraseña oculto por defecto -->
        <div id="passwordContainer" class="hidden animate-fadeIn">
          <label class="block text-xs font-semibold text-amber-400 mb-1.5"><i data-lucide="shield" class="inline w-3 h-3"></i> Contraseña de Administrador</label>
          <div class="relative">
            <i data-lucide="key" class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input type="password" id="passwordInput" placeholder="Requerida solo para Admins" class="w-full pl-10 pr-3.5 py-2.5 rounded-xl bg-slate-800/90 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 transition-colors">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-blue-600 via-cyan-500 to-blue-600 hover:from-blue-500 hover:to-cyan-400 text-white font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-cyan-500/20 cursor-pointer transition-all active:scale-98 mt-2">
          <i data-lucide="log-in" class="w-4 h-4"></i> Ingresar al Sistema
        </button>
      </form>
    </div>
  </main>

  <script src="animations.js"></script>
  <script type="module">
    import { db, firebaseConfig } from "./firebase-config.js";
    import { subscribeToGlobalTheme } from "./db.js";
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

    lucide.createIcons();
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const emailInput = document.getElementById("emailInput");
    const passwordContainer = document.getElementById("passwordContainer");
    const passwordInput = document.getElementById("passwordInput");
    const listaCorreos = document.getElementById("listaCorreos");
    let allUsers = [];

    // Cargar correos en la lista desplegable
    async function cargarCorreos() {
      const snap = await getDocs(collection(db, "users"));
      allUsers = snap.docs.map(d => d.data());
      allUsers.forEach(u => {
        const option = document.createElement("option");
        option.value = u.email;
        listaCorreos.appendChild(option);
      });
    }
    cargarCorreos();

    // Detectar si el correo escrito pertenece a un Admin para mostrar la contraseña
    emailInput.addEventListener("input", () => {
      const selected = allUsers.find(u => u.email.toLowerCase() === emailInput.value.toLowerCase());
      if (selected && selected.role === "admin") {
        passwordContainer.classList.remove("hidden");
        passwordInput.required = true;
      } else {
        passwordContainer.classList.add("hidden");
        passwordInput.required = false;
        passwordInput.value = "";
      }
    });

    const themeOrnaments = { navidad: "🎅", halloween: "🎃", dia_muertos: "🏵️", san_valentin: "💖", primavera: "🌸", estandar: "" };
    subscribeToGlobalTheme((activeTheme, activeBg) => {
      if (window.seasonalEngine) window.seasonalEngine.setTheme(activeTheme);
      const ornamentSpan = document.getElementById("logoSeasonOrnament");
      if (ornamentSpan) ornamentSpan.innerText = themeOrnaments[activeTheme] || "";
      document.body.style.backgroundColor = activeBg;
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const btn = document.getElementById("submitBtn");
      
      const userDoc = allUsers.find(u => u.email.toLowerCase() === email.toLowerCase());
      if (!userDoc) {
        mostrarError("Correo no registrado en la base de datos.");
        return;
      }

      btn.disabled = true; btn.innerText = "Iniciando...";
      document.getElementById("errorAlert").classList.add("hidden");

      // Si es usuario normal, usamos la contraseña universal secreta por detrás.
      // Si es admin, usamos la que tecleó.
      const pass = userDoc.role === "admin" ? passwordInput.value : "BemisUser2026!";

      try {
        const userCred = await signInWithEmailAndPassword(auth, email, pass);
        sessionStorage.setItem("bemis_session_user", JSON.stringify(userDoc));
        window.location.href = userDoc.role === "admin" ? "admin.html" : "user.html";
      } catch (error) {
        mostrarError(userDoc.role === "admin" ? "Contraseña de administrador incorrecta." : "Error de acceso.");
      }
      btn.disabled = false; btn.innerText = "Ingresar al Sistema";
    });

    function mostrarError(msg) {
      document.getElementById("errorAlert").classList.remove("hidden");
      document.getElementById("errorMsg").innerText = msg;
    }
  </script>
</body>
</html>
