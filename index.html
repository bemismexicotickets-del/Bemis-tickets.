<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BEMIS Tickets - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8f7f2;
      overflow-x: hidden;
    }
    #animationCanvas, #particles-js, .animation-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6 relative select-none">

  <!-- Canvas para animaciones de fondo (animations.js) -->
  <canvas id="animationCanvas"></canvas>
  <div id="themeAnimationContainer" class="fixed inset-0 pointer-events-none z-0"></div>

  <!-- Etiqueta superior izquierda -->
  <div class="relative z-10 flex items-center">
    <div class="inline-flex items-center gap-2.5 bg-white/90 backdrop-blur-md px-4 py-2 rounded-full shadow-sm border border-slate-200/80">
      <span class="w-2.5 h-2.5 rounded-full bg-blue-700"></span>
      <span class="text-xs font-semibold text-slate-700 tracking-tight">Bemis México • Soporte de Sistemas</span>
    </div>
  </div>

  <!-- Tarjeta central de Login -->
  <main class="relative z-10 flex-1 flex items-center justify-center my-8">
    <div class="w-full max-w-md bg-white rounded-[32px] shadow-[0_20px_60px_-15px_rgba(0,0,0,0.07)] border border-slate-100 p-8 sm:p-10 text-center">
      
      <!-- Logo Bemis -->
      <div class="flex justify-center mb-4">
        <svg class="h-14 w-auto" viewBox="0 0 220 70" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M25 22 C 65 4, 155 4, 195 22 C 150 12, 70 12, 25 22 Z" fill="#0047BA"/>
          <text x="110" y="54" text-anchor="middle" fill="#0047BA" font-family="Inter, Arial, sans-serif" font-weight="800" font-style="italic" font-size="38" letter-spacing="1">BEMIS</text>
          <path d="M35 60 L185 60" stroke="#0047BA" stroke-width="2.5"/>
        </svg>
      </div>

      <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">BEMIS TICKETS</h1>
      <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-widest mt-1 mb-8">Mesa de Ayuda de TI</p>

      <!-- Formulario de acceso -->
      <form id="loginForm" class="space-y-5 text-left">
        <div>
          <label for="emailSelect" class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">
            Selecciona tu correo corporativo
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
            </span>
            <select
              id="emailSelect"
              required
              class="w-full pl-10 pr-9 py-3.5 bg-white border border-slate-200 rounded-xl text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 transition appearance-none"
            >
              <option value="" disabled selected>Cargando correos...</option>
            </select>
            <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 pointer-events-none">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
              </svg>
            </span>
          </div>
        </div>

        <!-- Contenedor de contraseña (para Admin o usuarios con clave) -->
        <div id="passwordContainer" class="hidden space-y-2">
          <label for="adminPassword" class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider">
            Contraseña de acceso
          </label>
          <div class="relative">
            <input
              type="password"
              id="adminPassword"
              placeholder="Ingresa tu contraseña"
              class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition"
            />
            <button
              type="button"
              id="togglePasswordBtn"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 text-xs font-semibold"
            >
              Mostrar
            </button>
          </div>
        </div>

        <!-- Mensaje de error -->
        <div id="loginError" class="hidden text-xs font-medium text-red-600 bg-red-50 border border-red-100 rounded-xl p-3 text-center"></div>

        <!-- Botón de entrar -->
        <button
          type="submit"
          id="loginBtn"
          class="w-full py-3.5 px-6 bg-[#0f172a] hover:bg-slate-800 active:scale-[0.99] text-white font-semibold text-sm rounded-xl shadow-md transition flex items-center justify-center gap-2"
        >
          <span>Ingresar al Portal</span>
        </button>
      </form>

      <p class="text-[11px] text-slate-400 mt-8">© 2026 Bemis Manufacturing Company</p>
    </div>
  </main>

  <div class="h-4"></div>

  <!-- Animaciones visuales -->
  <script src="./animations.js"></script>

  <!-- Lógica modular conectada a tus archivos actuales -->
  <script type="module">
    import * as firebaseModule from './firebase-config.js';
    import * as dbModule from './db.js';
    import * as authModule from './auth.js';
    import { collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    const emailSelect = document.getElementById('emailSelect');
    const passwordContainer = document.getElementById('passwordContainer');
    const adminPassword = document.getElementById('adminPassword');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const loginBtn = document.getElementById('loginBtn');

    let usersMap = new Map();

    // 1. Suscribir tema estacional si existe en db.js
    if (typeof dbModule.subscribeToGlobalTheme === 'function') {
      try {
        dbModule.subscribeToGlobalTheme((themeData) => {
          if (window.setSeasonTheme && themeData?.theme) {
            window.setSeasonTheme(themeData.theme);
          }
        });
      } catch (err) {
        console.warn('Tema global no inicializado:', err);
      }
    }

    // 2. Mostrar/ocultar contraseña
    if (togglePasswordBtn && adminPassword) {
      togglePasswordBtn.addEventListener('click', () => {
        const isPass = adminPassword.type === 'password';
        adminPassword.type = isPass ? 'text' : 'password';
        togglePasswordBtn.textContent = isPass ? 'Ocultar' : 'Mostrar';
      });
    }

    // 3. Cargar lista de correos desde db.js o Firestore
    async function cargarCorreos() {
      try {
        let users = [];

        if (typeof dbModule.getAllUsers === 'function') {
          users = await dbModule.getAllUsers();
        } else if (firebaseModule.db) {
          const snap = await getDocs(collection(firebaseModule.db, 'users'));
          snap.forEach((doc) => users.push({ id: doc.id, ...doc.data() }));
        }

        // Asegurar que el correo de administrador esté presente
        const adminEmail =
          firebaseModule.ADMIN_EMAIL ||
          firebaseModule.SUPER_ADMIN_EMAIL ||
          'admin@bemis.com';

        const existeAdmin = users.some(
          (u) => (u.email || '').toLowerCase() === adminEmail.toLowerCase()
        );
        if (!existeAdmin && adminEmail) {
          users.push({ email: adminEmail, name: 'Administrador TI', role: 'admin' });
        }

        users.sort((a, b) => (a.email || '').localeCompare(b.email || ''));

        emailSelect.innerHTML =
          '<option value="" disabled selected>Selecciona tu correo...</option>';

        users.forEach((u) => {
          if (!u.email) return;
          const emailLower = u.email.toLowerCase().trim();
          usersMap.set(emailLower, u);

          const opt = document.createElement('option');
          opt.value = emailLower;
          opt.textContent = u.name ? `${u.name} (${emailLower})` : emailLower;
          emailSelect.appendChild(opt);
        });

        // Recordar último correo si existe
        if (typeof authModule.getRememberedEmail === 'function') {
          const remembered = authModule.getRememberedEmail();
          if (remembered && usersMap.has(remembered.toLowerCase())) {
            emailSelect.value = remembered.toLowerCase();
            verificarSiRequierePassword(emailSelect.value);
          }
        }
      } catch (error) {
        console.error('Error al cargar correos desde Firebase:', error);
        emailSelect.innerHTML =
          '<option value="" disabled selected>Error de conexión con Firebase</option>';
        mostrarError(
          'No se pudieron cargar los correos. Revisa la consola (F12) o las reglas de Firestore.'
        );
      }
    }

    function verificarSiRequierePassword(email) {
      if (!email) return;
      const userObj = usersMap.get(email.toLowerCase());
      const adminEmail = (
        firebaseModule.ADMIN_EMAIL ||
        firebaseModule.SUPER_ADMIN_EMAIL ||
        ''
      ).toLowerCase();

      const esAdmin =
        email.toLowerCase() === adminEmail ||
        userObj?.role === 'admin' ||
        userObj?.isAdmin === true ||
        Boolean(userObj?.password);

      if (esAdmin) {
        passwordContainer.classList.remove('hidden');
      } else {
        passwordContainer.classList.add('hidden');
        adminPassword.value = '';
      }
    }

    emailSelect.addEventListener('change', (e) => {
      loginError.classList.add('hidden');
      verificarSiRequierePassword(e.target.value);
    });

    function mostrarError(msg) {
      loginError.textContent = msg;
      loginError.classList.remove('hidden');
    }

    // 4. Iniciar sesión
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.classList.add('hidden');

      const email = emailSelect.value;
      const password = adminPassword.value;

      if (!email) {
        mostrarError('Por favor selecciona un correo de la lista.');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span>Verificando...</span>';

      try {
        if (typeof authModule.setRememberedEmail === 'function') {
          authModule.setRememberedEmail(email);
        }

        if (typeof authModule.login === 'function') {
          const result = await authModule.login(email, password);
          // Si authModule.login no redirige por sí solo, redirigimos según el rol
          if (result && !window.location.href.includes('admin.html') && !window.location.href.includes('user.html')) {
            const userObj = usersMap.get(email.toLowerCase());
            const esAdmin =
              result?.role === 'admin' ||
              result?.isAdmin ||
              userObj?.role === 'admin';
            window.location.href = esAdmin ? 'admin.html' : 'user.html';
          }
        }
      } catch (err) {
        console.error('Error en login:', err);
        mostrarError(err.message || 'Credenciales incorrectas o error de acceso.');
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<span>Ingresar al Portal</span>';
      }
    });

    cargarCorreos();
  </script>
</body>
</html>
